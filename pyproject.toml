[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-cytometry-gating-fcs-engine"
version = "2.0.0"
description = "Browser FCS exploration with a separate deterministic Python metric-audit CLI"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
flow-cytometry-gating-fcs-engine = "flow_cytometry_gate.cli:main"

[tool.setuptools.packages.find]
include = ["agents*", "flow_cytometry_gate*"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/flow-cytometry-gating-fcs-agent"
Repository = "https://github.com/abusuraihsakhri/flow-cytometry-gating-fcs-agent"
