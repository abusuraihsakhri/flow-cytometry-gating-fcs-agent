name: Tests and security checks

on:
  push:
    branches: [master, main, "audit/**"]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Python test suite
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q agents flow_cytometry_gate cli.py enrichment.py simulator.py
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
  browser-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and FCS tests
        run: |
          node --check web/fcs.js
          node --check web/app.js
          node --test tests/fcs.test.cjs
      - name: Check browser entry points
        run: |
          test -f index.html
          test -f web/index.html
          grep -q 'web/fcs.js' index.html
          grep -q './fcs.js' web/index.html
          grep -q './web/app.js' index.html
          grep -q './app.js' web/index.html
